name: Smart Plant validation
on:
  push:
    branches: [main]
    paths:
      - 'esp32/**'
      - 'raspberry_pi/**'
      - '.github/workflows/smartplant-validation.yml'
  pull_request:
    paths:
      - 'esp32/**'
      - 'raspberry_pi/**'
      - '.github/workflows/smartplant-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shell syntax
        run: |
          for script in raspberry_pi/*.sh; do bash -n "$script" || exit 1; done
      - name: Python syntax and host tests
        working-directory: raspberry_pi
        run: |
          python -m compileall -q smartplant_pi leaf_classifier tests project_energy.py
          python -m unittest discover -s tests -v
      - name: Install exact ONNX dependencies and download model
        working-directory: raspberry_pi
        run: |
          python -m pip install -r leaf_classifier/requirements.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request
          root=Path("leaf_classifier")
          a=next(a for a in json.loads((root/"ASSETS.json").read_text()) if a["path"]=="model.onnx")
          p=root/"model.onnx"
          with urllib.request.urlopen(a["url"], timeout=90) as response:
              data=response.read()
          if hashlib.sha256(data).hexdigest()!=a["sha256"]:
              raise SystemExit("ONNX model SHA256 mismatch")
          p.write_bytes(data)
          PY
          python leaf_classifier/verify_install.py
      - name: Full suite including real ONNX worker
        working-directory: raspberry_pi
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/smartplant-tests.log
          if grep -Eq 'skipped |OK \(skipped=' /tmp/smartplant-tests.log; then
            echo 'Final test suite unexpectedly skipped tests' >&2; exit 1
          fi
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, optimized]
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Fresh ESP32 firmware build
        shell: bash
        working-directory: esp32
        run: |
          source /opt/esp/idf/export.sh
          idf.py -B build-${{ matrix.profile }} -D "SDKCONFIG=sdkconfig.${{ matrix.profile }}" -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.${{ matrix.profile }}.defaults" build
